<!doctype html>
<!-- pagina minima pro build web (make web): so o canvas, sem a interface do emscripten -->
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>UNALTERED</title>
<style>
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden; }
  body { display: flex; align-items: center; justify-content: center; }
  canvas { display: block; outline: none; image-rendering: pixelated; }
</style>
</head>
<body>
<canvas id="canvas" tabindex="-1" oncontextmenu="event.preventDefault()"></canvas>
<script>
  // setas e espaco nao rolam a pagina (no itch o jogo fica num iframe)
  window.addEventListener('keydown', function (e) {
    if (['ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight', ' '].includes(e.key)) e.preventDefault();
  });
  var Module = { canvas: document.getElementById('canvas') };
</script>
{{{ SCRIPT }}}
</body>
</html>
